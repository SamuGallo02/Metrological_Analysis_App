# Builds the "single file" installers for Windows (.exe) and macOS (.app) with PyInstaller.
# Start: Actions tab > "Build installers" > Run workflow (or push a v* tag).
# The files appear as the run's "artifact" (and in the Release, if started from a tag).
#
# macOS: without an Apple Developer ID certificate the app is NOT signed and at first launch
# macOS shows the "unidentified developer" warning. To sign and notarize it
# add these Secrets to the repository: APPLE_CERT_BASE64 (.p12 certificate in base64),
# APPLE_CERT_PASSWORD, APPLE_SIGN_IDENTITY ("Developer ID Application: Name (TEAMID)"),
# APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific password).
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name Installa_AnalisiMetrologica --icon common/assets/app_icon.ico common/ambient/distribution/installer_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: Installa_AnalisiMetrologica-windows
          path: dist/Installa_AnalisiMetrologica.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Installa_AnalisiMetrologica.exe

  macos:
    runs-on: macos-latest
    env:
      APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --noconfirm --windowed --name "Installa Analisi Metrologica" --osx-bundle-identifier it.unipd.stereometrology.installer common/ambient/distribution/installer_gui.py
      - name: Firma e notarizza (solo se i Secrets Apple sono presenti)
        if: ${{ env.APPLE_CERT_BASE64 != '' }}
        run: |
          APP="dist/Installa Analisi Metrologica.app"
          echo "$APPLE_CERT_BASE64" | base64 --decode > cert.p12
          security create-keychain -p tmp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p tmp build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k tmp build.keychain
          codesign --deep --force --options runtime --timestamp --sign "$APPLE_SIGN_IDENTITY" "$APP"
          ditto -c -k --keepParent "$APP" notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$APP"
      - name: Crea lo zip da distribuire
        run: ditto -c -k --keepParent "dist/Installa Analisi Metrologica.app" Installa_AnalisiMetrologica_macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Installa_AnalisiMetrologica-macos
          path: Installa_AnalisiMetrologica_macOS.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Installa_AnalisiMetrologica_macOS.zip
