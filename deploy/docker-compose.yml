# docker compose -f deploy/docker-compose.yml up -d --build
# First start: docker compose -f deploy/docker-compose.yml exec server python -m server --data /data create-admin NAME
services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      AM_ADMIN_KEY: "${AM_ADMIN_KEY:-}"        # empty = access key disabled; use a long random one
    volumes:
      - server-data:/data
    expose: ["8765"]
  caddy:                                        # HTTPS with an automatic certificate
    image: caddy:2
    restart: unless-stopped
    depends_on: [server]
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
volumes:
  server-data:
  caddy-data:
